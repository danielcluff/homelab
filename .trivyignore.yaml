misconfigurations:
  - id: KSV-0041
    paths:
      - "homelab-traefik/charts/traefik/templates/rbac/clusterrole.yaml"
    statement: >-
      The internal ingress controller must watch TLS Secrets across the
      namespaces whose Ingress and IngressRoute resources it serves. It is not
      reachable through the public Cloudflare path. Reevaluate namespace-scoped
      Roles as the internal service set is consolidated.
    expired_at: 2027-02-10
  - id: KSV-0056
    paths:
      - "homelab-traefik/charts/traefik/templates/rbac/clusterrole.yaml"
    statement: >-
      Traefik requires update on ingresses/status to publish the internal
      MetalLB endpoint. It has read-only access to Services and cannot create,
      patch, or delete application traffic resources.
    expired_at: 2027-02-10
  - id: KSV-0044
    paths:
      - "homelab-code-server/templates/code-server-homelab-rbac.yaml"
    statement: >-
      This dedicated management Code Server intentionally has cluster-admin
      capabilities. It is reachable only through the internal Traefik path and
      is isolated from the public Cloudflare Tunnel path.
    expired_at: 2027-08-10
  - id: KSV-0046
    paths:
      - "homelab-code-server/templates/code-server-homelab-rbac.yaml"
    statement: >-
      This dedicated management Code Server intentionally has cluster-admin
      capabilities. Replace it with a narrower operator workflow if practical.
    expired_at: 2027-08-10
  - id: KSV-0118
    paths:
      - "homelab-code-server/templates/code-server-homelab.yaml"
    statement: >-
      The management container runs as UID 1000 but its current postStart
      bootstrap uses sudo to install tools. Replace the runtime bootstrap with
      a prebuilt image before enforcing allowPrivilegeEscalation=false.
    expired_at: 2027-02-10
  - id: KSV-0014
    paths:
      - "homelab-code-server/templates/code-server-homelab.yaml"
      - "homelab-code-server/templates/code-server-main.yaml"
    statement: >-
      These are interactive development environments that install tools and
      extensions and therefore require a writable container filesystem. Their
      workspaces are internal-only and isolated from the public ingress path.
    expired_at: 2027-02-10
  - id: KSV-0009
    paths:
      - "homelab-tailscale/templates/resources.yaml"
    statement: Kernel-mode subnet routing intentionally uses the host network.
    expired_at: 2027-08-10
  - id: KSV-0014
    paths:
      - "homelab-tailscale/templates/resources.yaml"
    statement: Tailscale kernel-mode networking requires writable runtime paths.
    expired_at: 2027-08-10
  - id: KSV-0017
    paths:
      - "homelab-tailscale/templates/resources.yaml"
    statement: >-
      The subnet router uses kernel networking and /dev/net/tun; the official
      Tailscale Kubernetes guidance documents privileged mode for this design.
    expired_at: 2027-08-10
  - id: KSV-0118
    paths:
      - "homelab-tailscale/templates/resources.yaml"
    statement: Tailscale kernel-mode subnet routing runs with elevated privileges.
    expired_at: 2027-08-10
  - id: KSV-0119
    paths:
      - "homelab-tailscale/templates/resources.yaml"
    statement: NET_RAW is part of the existing privileged kernel router configuration.
    expired_at: 2027-02-10
  - id: KSV-0120
    paths:
      - "homelab-tailscale/templates/resources.yaml"
    statement: >-
      SYS_MODULE is part of the existing kernel router configuration and must
      be retested for removal on Talos before this exception expires.
    expired_at: 2027-02-10
  - id: KSV-0009
    paths:
      - "homelab-openvpn/templates/resources.yaml"
    statement: The disabled TAP VPN requires host networking when deliberately enabled.
    expired_at: 2027-02-10
  - id: KSV-0014
    paths:
      - "homelab-openvpn/templates/resources.yaml"
    statement: The legacy TAP VPN is disabled and retained only for occasional OS 9 use.
    expired_at: 2027-02-10
  - id: KSV-0017
    paths:
      - "homelab-openvpn/templates/resources.yaml"
    statement: The disabled TAP VPN requires privileged bridge and tunnel management.
    expired_at: 2027-02-10
  - id: KSV-0118
    paths:
      - "homelab-openvpn/templates/resources.yaml"
    statement: The privileged TAP VPN is disabled by default.
    expired_at: 2027-02-10
  - id: KSV-0119
    paths:
      - "homelab-openvpn/templates/resources.yaml"
    statement: The disabled TAP VPN requires raw network operations when enabled.
    expired_at: 2027-02-10
  - id: KSV-0120
    paths:
      - "homelab-openvpn/templates/resources.yaml"
    statement: >-
      The legacy TAP image currently requests SYS_MODULE; remove or retire the
      chart before enabling it again.
    expired_at: 2027-02-10
  - id: KSV-0053
    paths:
      - "manifests/devpod-rbac.yaml"
    statement: >-
      DevPod requires create on pods/exec to connect the local IDE to workspace
      containers. The Role is restricted to the dedicated devpod namespace and
      is not used by public or internal application workloads.
    expired_at: 2027-08-10
