name: Security scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and Kubernetes configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # v4; full SHA prevents a mutable action tag from changing executed code.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Scan Kubernetes and repository configuration
        # 0.35.0 is the immutable, remediated release identified by GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: config
          scan-ref: .
          version: v0.69.3
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "0"
          skip-dirs: helm/sealed-secrets

      - name: Scan committed files for secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          version: v0.69.3
          scanners: secret
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "0"
          skip-dirs: helm/sealed-secrets
          skip-setup-trivy: true
