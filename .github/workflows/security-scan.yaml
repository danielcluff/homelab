name: Security scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and Kubernetes configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # v6.0.2 (Node.js 24); full SHA prevents a mutable tag changing executed code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Render Helm charts for scanning
        run: ./scripts/render-helm-for-scan.sh

      - name: Scan Kubernetes and repository configuration
        # v0.36.0 uses SHA-pinned, Node.js 24-compatible setup and cache actions.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .trivy-rendered
          version: v0.69.3
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Scan committed files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          version: v0.69.3
          scanners: secret
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "1"
          skip-dirs: helm/sealed-secrets,.trivy-rendered
          skip-setup-trivy: true
