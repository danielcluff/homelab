name: Security scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and Kubernetes configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # v6.0.2 (Node.js 24); full SHA prevents a mutable tag changing executed code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Render Helm charts for scanning
        run: ./scripts/render-helm-for-scan.sh

      - name: Scan Kubernetes and repository configuration
        # v0.36.0 uses SHA-pinned, Node.js 24-compatible setup and cache actions.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .trivy-rendered
          version: v0.69.3
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Scan public workload images
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t images < <(./scripts/list-workload-images.rb .trivy-rendered)
          scanned=0
          skipped=0

          for image in "${images[@]}"; do
            if [[ "${image}" == 192.168.1.53:5000/* ]]; then
              echo "Skipping LAN-only image from GitHub runner: ${image}"
              skipped=$((skipped + 1))
              continue
            fi

            echo "::group::Trivy image scan: ${image}"
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --no-progress \
              "${image}"
            echo "::endgroup::"
            scanned=$((scanned + 1))
          done

          {
            echo "### Container image vulnerability baseline"
            echo
            echo "- Public images scanned: ${scanned}"
            echo "- LAN-only images not reachable from GitHub: ${skipped}"
            echo "- Vulnerabilities are report-only during baseline triage."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Scan committed files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          version: v0.69.3
          scanners: secret
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "1"
          skip-dirs: helm/sealed-secrets,.trivy-rendered
          skip-setup-trivy: true
