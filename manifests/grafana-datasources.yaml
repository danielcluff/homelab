apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
          queryTimeout: 300s

      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
        editable: true
        jsonData:
          implementation: prometheus
