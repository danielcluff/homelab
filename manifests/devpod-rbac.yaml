---
# DevPod ServiceAccount, Role, and RoleBinding
# Permissions needed for DevPod to create and manage workspaces in Kubernetes

apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpod-workspace
  namespace: devpod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-workspace
  namespace: devpod
rules:
  # Pod management
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward", "pods/attach"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  
  # Persistent storage
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Secrets and configmaps
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Deployments (optional, for more complex setups)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-workspace
  namespace: devpod
subjects:
  - kind: ServiceAccount
    name: devpod-workspace
    namespace: devpod
roleRef:
  kind: Role
  name: devpod-workspace
  apiGroup: rbac.authorization.k8s.io
