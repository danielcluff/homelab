apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elate-me-tls
  namespace: cert-manager
spec:
  secretName: elate-me-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiration
  commonName: "*.elate.me"
  dnsNames:
    - "*.elate.me"
    - "elate.me"
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
