---
# Pi-hole configuration for homelab
# DNS and ad blocking

# Service configuration - use LoadBalancer for DNS access
serviceDns:
    type: LoadBalancer
    loadBalancerIP: "192.168.1.51" # Static IP from MetalLB pool
    annotations:
        metallb.universe.tf/allow-shared-ip: pihole-svc

serviceWeb:
    type: LoadBalancer
    loadBalancerIP: "192.168.1.51" # Same IP as DNS
    annotations:
        metallb.universe.tf/allow-shared-ip: pihole-svc
    http:
        enabled: true
        port: 80

# DNS settings - Use external DNS directly to avoid loops when router points to Pi-hole
DNS1: "1.1.1.1" # Cloudflare primary
DNS2: "8.8.8.8" # Google DNS backup

# Admin password is created by sealedsecrets/pihole-password-sealed.yaml.
# Never put the plaintext password in this values file.
adminPassword: ""
admin:
    enabled: true
    existingSecret: "pihole-password"
    passwordKey: "password"

# Persistent storage - enabled with Longhorn
persistentVolumeClaim:
    enabled: true
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 5Gi

# Additional configuration
# Custom DNS records for elate.me subdomains only
# NOTE: Root domain elate.me is NOT included - it resolves via Cloudflare to VPS
dnsmasq:
    customDnsEntries:
        - address=/dashboard.elate.me/192.168.1.50
        - address=/traefik.elate.me/192.168.1.50
        - address=/longhorn.elate.me/192.168.1.50
        - address=/pihole.elate.me/192.168.1.51
        - address=/dev.elate.me/192.168.1.50
        - address=/homelab.elate.me/192.168.1.50
        - address=/grafana.elate.me/192.168.1.50
        - address=/uptime.elate.me/192.168.1.50
        - address=/vpn.elate.me/192.168.1.54

# Resources
resources:
    limits:
        cpu: 200m
        memory: 256Mi
    requests:
        cpu: 100m
        memory: 128Mi

# Tolerations for control plane (single node cluster)
tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
