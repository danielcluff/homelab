traefik:
  image:
    tag: v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac

  deployment:
    replicas: 2

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ingressClass:
    enabled: true
    isDefaultClass: false
    name: traefik-public

  providers:
    kubernetesCRD:
      enabled: false
    kubernetesIngress:
      enabled: true
      allowEmptyServices: false
      allowExternalNameServices: false
      ingressClass: traefik-public
      namespaces:
        - public-sites
      publishedService:
        enabled: false

  ingressRoute:
    dashboard:
      enabled: false
    healthcheck:
      enabled: false

  api:
    dashboard: false

  rbac:
    enabled: false

  service:
    spec:
      type: ClusterIP

  ports:
    web:
      port: 8000
      exposedPort: 80
    websecure:
      expose:
        default: false

  log:
    level: INFO
  accessLog:
    enabled: true

  metrics:
    prometheus:
      enabled: true
      service:
        enabled: true

  podSecurityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-public-traefik-public

  additionalArguments:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false
    - --providers.kubernetesingress.disableclusterscoperesources=true
