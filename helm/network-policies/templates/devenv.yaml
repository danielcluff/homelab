{{- range .Values.namespaces }}
{{- if and (eq .name "devenv") (eq .mode "enforce") }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: devenv-enforced
  namespace: devenv
  labels:
    app.kubernetes.io/managed-by: Helm
    homelab.elate.me/policy-stage: enforce
specs:
  - endpointSelector:
      matchLabels:
        app: code-server
    ingress:
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: traefik
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      - toEntities:
          - world
        toPorts:
          - ports:
              - port: "22"
                protocol: TCP
              - port: "80"
                protocol: TCP
              - port: "443"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: traefik
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: registry
              app: registry
        toPorts:
          - ports:
              - port: "5000"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app: code-server
        environment: homelab
    egress:
      - toEntities:
          - host
          - remote-node
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
{{- end }}
{{- end }}
