{{- range .Values.namespaces }}
{{- if and (eq .name "metallb-system") (eq .mode "enforce") }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metallb-controller-enforced
  namespace: metallb-system
  labels:
    app.kubernetes.io/managed-by: Helm
    homelab.elate.me/policy-stage: enforce
spec:
  # Speakers use hostNetwork and are intentionally outside this selector and
  # namespaced Cilium enforcement. This policy isolates the controller only.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metallb
      app.kubernetes.io/component: controller
  ingress:
    # Kubelet liveness/readiness probes use the metrics listener. Kubernetes
    # admission requests reach the webhook after service translation.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "7472", protocol: TCP }
            - { port: "9443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The controller watches Services, EndpointSlices, Nodes, Secrets, and
    # MetalLB custom resources through the translated API endpoint.
    - toEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP }
{{- end }}
{{- end }}
