server {
    listen 8080;
    server_name _;

    # Cloudflare terminates TLS and talks HTTP to this origin. Directory
    # redirects must stay relative so nginx does not emit :8080 or http://.
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
