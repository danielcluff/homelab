image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.29.5-alpine"
  pullPolicy: IfNotPresent

replicaCount: 2

sites:
  - name: elate-me
    domain: elate.me
    publicIngress: true
    # Preserve the live objects when this site is removed from the legacy
    # release so Argo CD can adopt them without an availability gap.
    migrationKeep: true
    image:
      repository: 192.168.1.53:5000/elate-me
      tag: "hosting-20260806b"
      pullPolicy: Always
resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
