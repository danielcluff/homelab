project:
  name: public-applications
  sourceRepository: https://github.com/danielcluff/homelab-apps.git
  destinationNamespace: public-sites
  # Use a distinct identity from Argo CD's reserved implicit in-cluster URL so
  # this Application selects the namespace-scoped sealed cluster credential.
  destinationServer: https://kubernetes.default.svc.cluster.local
  orphanWarnings: false

application:
  name: homelab-apps-production
  revision: main
  path: .
  valuesFile: environments/production.yaml
  automated:
    enabled: true
    prune: true
    selfHeal: true
