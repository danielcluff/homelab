---
# Project-specific dev environment template
# Copy this file and customize for each project
# Accessible at https://project1.home.com (customize hostname)
# Deploy with: helm install code-server-project1 coder/code-server -n devenv -f helm/code-server/values-project1.yaml

image:
  repository: codercom/code-server
  tag: latest
  pullPolicy: IfNotPresent

# Code-server authentication
extraArgs:
  - --auth
  - none

# Environment variables
extraEnvVars:
  - name: TZ
    value: America/Chicago
  - name: PROJECT_NAME
    value: project1

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress configuration
# CUSTOMIZE: Change hostname for each project
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: project1.home.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: home.com-tls
      hosts:
        - project1.home.com

# Persistence configuration
# CUSTOMIZE: Adjust size based on project needs
persistence:
  enabled: true
  storageClassName: longhorn
  accessMode: ReadWriteOnce
  size: 10Gi
  # Mounts to /home/coder by default

# Extra volumes for shared storage
# This references the shared PVC created separately
extraVolumes:
  - name: shared
    persistentVolumeClaim:
      claimName: devenv-shared

extraVolumeMounts:
  - name: shared
    mountPath: /mnt/shared

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Allow scheduling on control plane node (single-node cluster)
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Security context
securityContext:
  enabled: true
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Affinity
affinity: {}
