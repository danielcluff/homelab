---
# Project-specific dev environment template
# Copy this file and customize for each project
# Accessible at https://project1.elate.me (customize hostname)
# Deploy with: helm install code-server-project1 coder/code-server -n devenv -f helm/code-server/values-project1.yaml

image:
  repository: ghcr.io/coder/code-server
  tag: "latest@sha256:3623e6362abdec6258472882b06fdeec9d6ce2ad3fda316b3c5d7ed092b89add"
  pullPolicy: IfNotPresent

# Code-server authentication
extraArgs:
  - --auth
  - none

# Environment variables
extraEnvVars:
  - name: TZ
    value: America/Chicago
  - name: PROJECT_NAME
    value: project1

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress configuration
# CUSTOMIZE: Change hostname for each project
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: project1.elate.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: project1-elate-me-tls
      hosts:
        - project1.elate.me

# Persistence configuration
# CUSTOMIZE: Adjust size based on project needs
persistence:
  enabled: true
  storageClassName: longhorn
  accessMode: ReadWriteOnce
  size: 10Gi
  # Mounts to /home/coder by default

# Extra volumes for shared storage
# This references the shared PVC created separately
extraVolumes:
  - name: shared
    persistentVolumeClaim:
      claimName: devenv-shared

extraVolumeMounts:
  - name: shared
    mountPath: /mnt/shared

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Allow scheduling on control plane node (single-node cluster)
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Security context
securityContext:
  enabled: true
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Affinity
affinity: {}

# Lifecycle hooks to install Claude Code and Open Code
lifecycle:
  postStart:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          # Install Node.js if not present
          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          # Install Claude Code and Open Code
          sudo npm install -g @anthropic-ai/claude-code opencode-ai || true
          echo "Claude Code and Open Code installation complete"
