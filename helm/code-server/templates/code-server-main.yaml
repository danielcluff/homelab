---
# Main dev environment deployment
# Access: https://dev.elate.me
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server-main
  namespace: devenv
  labels:
    app: code-server
    environment: main
spec:
  replicas: 1
  # The workspace and shared volumes are ReadWriteOnce. Stop the old pod before
  # creating its replacement so Longhorn can detach and reattach cleanly.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: code-server
      environment: main
  template:
    metadata:
      labels:
        app: code-server
        environment: main
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Both code-server instances mount the same ReadWriteOnce shared PVC.
      # Keep the main instance on the node where the homelab instance is
      # running so Longhorn only needs to attach that volume to one node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: code-server
                  environment: homelab
              topologyKey: kubernetes.io/hostname
      containers:
        - name: code-server
          image: ghcr.io/coder/code-server@sha256:3623e6362abdec6258472882b06fdeec9d6ce2ad3fda316b3c5d7ed092b89add
          imagePullPolicy: IfNotPresent
          args:
            - --auth
            - none
            - --bind-addr
            - 0.0.0.0:8080
          env:
            - name: TZ
              value: America/Chicago
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: workspace
              mountPath: /home/coder
            - name: shared
              mountPath: /mnt/shared
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: devenv-main-workspace
        - name: shared
          persistentVolumeClaim:
            claimName: devenv-shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devenv-main-workspace
  namespace: devenv
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: code-server
    environment: main
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: code-server-main
  namespace: devenv
  labels:
    app: code-server
    environment: main
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: code-server
    environment: main
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server-main
  namespace: devenv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.tls: "true"
  labels:
    app: code-server
    environment: main
spec:
  ingressClassName: traefik
  rules:
    - host: dev.elate.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server-main
                port:
                  number: 8080
  tls:
    - secretName: elate.me-tls
      hosts:
        - dev.elate.me
