---
# HomeLab management dev environment deployment
# Access: https://homelab.elate.me
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server-homelab
  namespace: devenv
  labels:
    app: code-server
    environment: homelab
spec:
  replicas: 1
  # The workspace and shared volumes are ReadWriteOnce. Stop the old pod before
  # creating its replacement so Longhorn can detach and reattach cleanly.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: code-server
      environment: homelab
  template:
    metadata:
      labels:
        app: code-server
        environment: homelab
    spec:
      serviceAccountName: code-server-homelab
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: code-server
          image: ghcr.io/coder/code-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - --auth
            - none
            - --bind-addr
            - 0.0.0.0:8080
          env:
            - name: TZ
              value: America/Chicago
            - name: PROJECT_NAME
              value: homelab
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Install git if not present
                    if ! command -v git &> /dev/null; then
                      sudo apt-get update && sudo apt-get install -y git
                    fi

                    # Clone homelab repo if workspace is empty (first run)
                    REPO_DIR="/home/coder/homelab"
                    REPO_URL="https://github.com/danielcluff/homelab.git"
                    if [ ! -d "$REPO_DIR/.git" ]; then
                      echo "Cloning homelab repository..."
                      git clone "$REPO_URL" "$REPO_DIR.tmp"
                      mv "$REPO_DIR.tmp"/* "$REPO_DIR.tmp"/.[!.]* "$REPO_DIR"/ 2>/dev/null || true
                      rm -rf "$REPO_DIR.tmp"
                    fi

                    # Install Node.js if not present
                    if ! command -v node &> /dev/null; then
                      curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                      sudo apt-get install -y nodejs
                    fi
                    # Install Claude Code and Open Code
                    sudo npm install -g @anthropic-ai/claude-code opencode-ai || true
                    echo "Claude Code and Open Code installation complete"

                    # Install kubectl if not present
                    if ! command -v kubectl &> /dev/null; then
                      curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                      sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
                      rm kubectl
                    fi

                    # Install helm if not present
                    if ! command -v helm &> /dev/null; then
                      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
                    fi

                    # Setup kubeconfig
                    mkdir -p ~/.kube
                    if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
                      echo "Kubernetes service account detected - kubectl will use in-cluster auth"
                    fi

                    echo "HomeLab management tools installation complete"
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: workspace
              mountPath: /home/coder/homelab
            - name: shared
              mountPath: /mnt/shared
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: devenv-homelab-workspace
        - name: shared
          persistentVolumeClaim:
            claimName: devenv-shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devenv-homelab-workspace
  namespace: devenv
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: code-server
    environment: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: code-server-homelab
  namespace: devenv
  labels:
    app: code-server
    environment: homelab
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: code-server
    environment: homelab
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server-homelab
  namespace: devenv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.tls: "true"
  labels:
    app: code-server
    environment: homelab
spec:
  ingressClassName: traefik
  rules:
    - host: homelab.elate.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server-homelab
                port:
                  number: 8080
  tls:
    - secretName: elate.me-tls
      hosts:
        - homelab.elate.me
