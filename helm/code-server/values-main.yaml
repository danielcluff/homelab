---
# Main dev environment configuration
# Accessible at https://dev.elate.me
# Deploy with: helm install code-server-main coder/code-server -n devenv -f helm/code-server/values-main.yaml

image:
  repository: ghcr.io/coder/code-server
  tag: "latest@sha256:3623e6362abdec6258472882b06fdeec9d6ce2ad3fda316b3c5d7ed092b89add"
  pullPolicy: IfNotPresent

# Code-server doesn't have a password by default
# Set PASSWORD env var if you want password protection
# Or use --link flag for one-time authentication links
extraArgs:
  - --auth
  - none
  # - --disable-telemetry

# Environment variables
extraEnvVars:
  - name: TZ
    value: America/Chicago

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: dev.elate.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dev-elate-me-tls
      hosts:
        - dev.elate.me

# Persistence configuration
persistence:
  enabled: true
  storageClassName: longhorn
  accessMode: ReadWriteOnce
  size: 20Gi
  existingClaim: devenv-main-workspace
  # Mounts to /home/coder by default

# Extra volumes for shared storage
extraVolumes:
  - name: shared
    persistentVolumeClaim:
      claimName: devenv-shared

extraVolumeMounts:
  - name: shared
    mountPath: /mnt/shared

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Allow scheduling on control plane node (single-node cluster)
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Security context
securityContext:
  enabled: true
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Affinity
affinity: {}

# Lifecycle hooks to install Claude Code and Open Code
lifecycle:
  postStart:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          # Install Node.js if not present
          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          # Install Claude Code and Open Code
          sudo npm install -g @anthropic-ai/claude-code opencode-ai || true
          echo "Claude Code and Open Code installation complete"
