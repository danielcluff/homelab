---
# HomeLab management dev environment
# Dedicated instance for cluster management
# Accessible at https://homelab.elate.me
# Deploy with: helm install code-server-homelab pascaliske/code-server -n devenv -f helm/code-server/values-homelab.yaml

homelabImage:
  # Built from images/code-server-homelab/Dockerfile and pinned to the digest
  # returned by the LAN registry after the verified build.
  repository: 192.168.1.53:5000/code-server-homelab
  tag: "20260810@sha256:b4ecd2cc39eac747877a094ac915d2f9aa519829e74d07712093260b93158efe"
  pullPolicy: IfNotPresent

# Code-server authentication
extraArgs:
  - --auth
  - none

# Environment variables
extraEnvVars:
  - name: TZ
    value: America/Chicago
  - name: PROJECT_NAME
    value: homelab

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: homelab.elate.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: homelab-elate-me-tls
      hosts:
        - homelab.elate.me

# Persistence configuration
# Dedicated storage for homelab repo at /home/coder/homelab
persistence:
  enabled: true
  storageClassName: longhorn
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /home/coder/homelab

# Extra volumes for shared storage
extraVolumes:
  - name: shared
    persistentVolumeClaim:
      claimName: devenv-shared

extraVolumeMounts:
  - name: shared
    mountPath: /mnt/shared

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Allow scheduling on control plane node (single-node cluster)
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Security context
securityContext:
  enabled: true
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Affinity
affinity: {}
