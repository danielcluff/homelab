---
# Legacy reference profile for the homelab management environment.
# The repository-owned chart does not consume this file. Its canonical image
# and deployment configuration live in values.yaml and templates/.

# Code-server authentication
extraArgs:
  - --auth
  - none

# Environment variables
extraEnvVars:
  - name: TZ
    value: America/Chicago
  - name: PROJECT_NAME
    value: homelab

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: homelab.elate.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: homelab-elate-me-tls
      hosts:
        - homelab.elate.me

# Persistence configuration
# Dedicated storage for homelab repo at /home/coder/homelab
persistence:
  enabled: true
  storageClassName: longhorn
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /home/coder/homelab

# Extra volumes for shared storage
extraVolumes:
  - name: shared
    persistentVolumeClaim:
      claimName: devenv-shared

extraVolumeMounts:
  - name: shared
    mountPath: /mnt/shared

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Allow scheduling on control plane node (single-node cluster)
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Security context
securityContext:
  enabled: true
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Affinity
affinity: {}
