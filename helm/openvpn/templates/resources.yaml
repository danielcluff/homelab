# OpenVPN TAP Bridge for AppleTalk (SheepShaver)
# Provides L2 bridging for AppleTalk discovery between OS 9 VMs
# Access: Connect Macs with SheepShaver via Tunnelblick to vpn.elate.me:1194
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openvpn-pki
  namespace: openvpn
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: openvpn
    component: tap-bridge
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openvpn-tap
  namespace: openvpn
  labels:
    app: openvpn
    component: tap-bridge
spec:
  serviceName: openvpn-tap
  replicas: 1
  selector:
    matchLabels:
      app: openvpn
      component: tap-bridge
  template:
    metadata:
      labels:
        app: openvpn
        component: tap-bridge
    spec:
      # Run on host network for UDP access and bridge functionality
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Allow scheduling on control plane node
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: openvpn
          image: salvoxia/openvpn-tap:latest
          imagePullPolicy: IfNotPresent
          # Start OpenVPN if config exists, otherwise sleep for PKI initialization
          command: ["/bin/bash", "-c"]
          args:
            - |
              if [ -f /etc/openvpn/ovpn_env.sh ]; then
                echo "PKI initialized, starting OpenVPN..."
                exec ovpn_run
              else
                echo "PKI not initialized. Run these commands to initialize:"
                echo "  kubectl exec -it -n openvpn openvpn-tap-0 -- bash"
                echo "  ovpn_genconfig -t -u udp://vpn.elate.me -s 192.168.1.0/24 -b -B 192.168.1.54 255.255.255.0 192.168.1.80 192.168.1.99"
                echo "  ovpn_initpki"
                echo "  easyrsa build-client-full mac1 nopass"
                echo "  easyrsa build-client-full mac2 nopass"
                echo "Then restart: kubectl rollout restart statefulset/openvpn-tap -n openvpn"
                echo "Sleeping..."
                exec sleep infinity
              fi
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_MODULE
          ports:
            - name: openvpn
              containerPort: 1194
              protocol: UDP
          volumeMounts:
            - name: pki
              mountPath: /etc/openvpn
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: pki
          persistentVolumeClaim:
            claimName: openvpn-pki
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
# LoadBalancer service for external VPN access
apiVersion: v1
kind: Service
metadata:
  name: openvpn-tap
  namespace: openvpn
  labels:
    app: openvpn
    component: tap-bridge
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.1.54"
  selector:
    app: openvpn
    component: tap-bridge
  ports:
    - name: openvpn
      port: 1194
      targetPort: 1194
      protocol: UDP
