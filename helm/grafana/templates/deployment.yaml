{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "grafana",
    "namespace": "monitoring",
    "labels": {
      "app": "grafana"
    }
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app": "grafana"
      }
    },
    "strategy": {
      "rollingUpdate": {
        "maxSurge": "25%",
        "maxUnavailable": "25%"
      },
      "type": "RollingUpdate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "grafana"
        }
      },
      "spec": {
        "containers": [
          {
            "env": [
              {
                "name": "GF_INSTALL_PLUGINS",
                "value": "grafana-piechart-panel"
              },
              {
                "name": "GF_SERVER_ROOT_URL",
                "value": "https://grafana.elate.me"
              },
              {
                "name": "GF_SECURITY_ALLOW_EMBEDDING",
                "value": "true"
              },
              {
                "name": "GF_SECURITY_ADMIN_PASSWORD",
                "value": "grafana"
              },
              {
                "name": "GF_SECURITY_ADMIN_USER",
                "value": "admin"
              },
              {
                "name": "GF_SERVER_SERVE_FROM_SUB_PATH",
                "value": "false"
              },
              {
                "name": "GF_SERVER_DOMAIN",
                "value": "grafana.elate.me"
              }
            ],
            "image": "grafana/grafana:10.4.2",
            "imagePullPolicy": "IfNotPresent",
            "livenessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/api/health",
                "port": 3000,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 60,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 5
            },
            "name": "grafana",
            "ports": [
              {
                "containerPort": 3000,
                "name": "http",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/api/health",
                "port": 3000,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 5,
              "successThreshold": 1,
              "timeoutSeconds": 3
            },
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/var/lib/grafana",
                "name": "grafana-storage"
              },
              {
                "mountPath": "/etc/grafana/provisioning/datasources",
                "name": "datasources"
              }
            ]
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {
          "fsGroup": 472,
          "runAsNonRoot": true,
          "runAsUser": 472
        },
        "serviceAccount": "grafana",
        "serviceAccountName": "grafana",
        "terminationGracePeriodSeconds": 30,
        "volumes": [
          {
            "name": "grafana-storage",
            "persistentVolumeClaim": {
              "claimName": "grafana-pvc"
            }
          },
          {
            "configMap": {
              "defaultMode": 420,
              "name": "grafana-datasources"
            },
            "name": "datasources"
          }
        ]
      }
    }
  }
}
