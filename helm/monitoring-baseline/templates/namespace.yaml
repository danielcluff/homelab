apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter intentionally requires hostNetwork, hostPID and hostPath.
    # Scope the exception to monitoring rather than weakening cluster defaults.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

