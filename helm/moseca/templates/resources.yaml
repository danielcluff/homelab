# Moseca - Music Source Separation & Karaoke
# Access: https://audio.elate.me
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moseca
  namespace: moseca
  labels:
    app: moseca
spec:
  replicas: 0
  selector:
    matchLabels:
      app: moseca
  template:
    metadata:
      labels:
        app: moseca
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: moseca
          image: 192.168.1.53:5000/moseca:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          env:
            - name: LIMIT_CPU
              value: "true"
            - name: ENV_LIMITATION
              value: "true"
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: moseca
  namespace: moseca
  labels:
    app: moseca
spec:
  type: ClusterIP
  ports:
    - port: 7860
      targetPort: 7860
      protocol: TCP
      name: http
  selector:
    app: moseca
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moseca-ingress
  namespace: moseca
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: audio.elate.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: moseca
            port:
              number: 7860
  tls:
  - hosts:
    - audio.elate.me
    secretName: elate.me-tls
