apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-elate-me-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: traefik-elate-me-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - traefik.elate.me
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
