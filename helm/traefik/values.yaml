traefik:
  image:
    tag: v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
  versionOverride: v3.7.10

  global:
    checkNewVersion: false
    sendAnonymousUsage: false

  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.elate.me`)
      entryPoints:
        - websecure
      tls:
        secretName: traefik-elate-me-tls

  gateway:
    enabled: false
  gatewayClass:
    enabled: false

  providers:
    kubernetesCRD:
      enabled: true
    kubernetesIngress:
      enabled: true
      ingressClass: traefik
      publishedService:
        enabled: true
    kubernetesGateway:
      enabled: false

  service:
    spec:
      type: LoadBalancer
      loadBalancerIP: 192.168.1.50

  ports:
    web:
      port: 80
      exposedPort: 80
    websecure:
      port: 443
      exposedPort: 443
      http:
        tls:
          enabled: true

  log:
    level: INFO
  accessLog:
    enabled: true

  tlsStore:
    default:
      defaultCertificate:
        secretName: traefik-elate-me-tls
