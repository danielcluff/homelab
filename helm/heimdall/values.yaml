---
# Heimdall dashboard configuration for homelab
# Accessible at https://dashboard.elate.me

image:
  repository: linuxserver/heimdall
  pullPolicy: IfNotPresent
  # Pin the exact image while retaining the human-readable upstream channel.
  tag: "latest@sha256:97d0cdf2a70da1f276da96051f47926f68b880293b3e1bd3e4d209e11573fb93"

env:
  TZ: America/Chicago
  PUID: "1000"
  PGID: "1000"

service:
  main:
    ports:
      http:
        port: 80
        targetPort: 80

ingress:
  main:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: dashboard.elate.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: elate.me-tls
        hosts:
          - dashboard.elate.me

persistence:
  config:
    enabled: true
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

affinity: {}
